<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header id="main-header">
        <h1>Native Plant App</h1>
        <p>Details about the selected plant</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="search.html">Plants</a>
        <a href="details.html">Search</a>
        <a href="about.html">About</a>
        <a href="admin.html">Add Plant</a>
    </nav>
<main>
  <section class="details-box">
    <h2>Plant Search</h2>

    <input type="text" id="search" placeholder="Search for a plant...">

    <select id="soil-filter">
      <option value="all">All Soil Types</option>
      <option value="Well-drained soil">Well-drained</option>
      <option value="Sandy soil">Sandy</option>
      <option value="Moist soil">Moist</option>
    </select>

    <select id="height-filter">
      <option value="all">All Heights</option>
      <option value="short">Short (under 2 ft)</option>
      <option value="tall">Tall (2 ft and up)</option>
    </select>

    <button id="reset-button">Reset</button>

    <p id="plant-count"></p>

    <div id="plant-container"></div>
  </section>
</main>

<script src="js/plants.js"></script>

    <footer>
        <p>&copy; 2026 Native Plants of PA.</p>
        <p>Created by Danilo Salazar</p>
    </footer>
</body>
</html>
